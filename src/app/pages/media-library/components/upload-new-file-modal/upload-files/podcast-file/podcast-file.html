<div class="d-flex align-items-center justify-content-center gap-2">


    <app-form-select label="Podcast Category Name" style="width:530px;" [options]="catogories" optionLabel="DisplayText"
        optionValue="DataValue" placeholder="e.g., Music / Entertainment / Sports" name="host"
        [(model)]="selectedCategoryId" (modelChange)="onCategoryChange($event)" [disabled]="readOnly || !!editData">
    </app-form-select>

</div>


<!-- program name -->

<div class="form-row px-4">

    <app-form-select label="Program Name" [options]="poadcastProgramList" optionLabel="DisplayText"
        optionValue="DataValue" [(model)]="selectedProgramId" (modelChange)="onProgramChange($event)"
        placeholder="- Select Program Name -" name="host" [disabled]="readOnly || !!editData">
    </app-form-select>
</div>
<!-- step 3 -->

<div class="custom-line-sub" style="margin-top: 14px;"></div>

<app-step-badge [stepNumber]="3" title="Rename File"></app-step-badge>

<div class="form-row px-4 pt-3">
    <div class="form-group">
        <div class="input-prefix-wrapper">
            <span class="prefix">{{selectedProgramName}}//</span>


            <input class="editable-part-input" type="text" maxlength="8" placeholder="16/03/26" [(ngModel)]="typedText"
                (ngModelChange)="onDateChange($event)" [readonly]="readOnly" />
        </div>
        <p class="helper-text">Use the broadcast date in DDMMYY format.</p>
    </div>
    <div class="error-text" *ngIf="errors.date">
        <img src="/program/warn.svg" class="small mb-1">
        {{ errors.date }}
    </div>
</div>
<div class="custom-line-sub"></div>

<!-- step 4 -->
<app-step-badge [stepNumber]="4" title="Thumbnail"></app-step-badge>
<div class="px-4 py-1">

    <div class="radio-grp py-2 px-1">
        <div class="custom-radio" [class.selected]="selectedType === 'program'"
            (click)="onThumbnailTypeChange('program')">
            <div class="circle"></div>
            <span>Use Program Thumbnail</span>
        </div>

        <div class="custom-radio" [class.selected]="selectedType === 'custom'"
            (click)="onThumbnailTypeChange('custom')">
            <div class="circle"></div>
            <span>Upload Custom Thumbnail</span>
        </div>
    </div>

    <div [hidden]="selectedType !== 'program'" class="mt-3 px-4">

        <!-- Show image if thumbnail exists -->
        <div *ngIf="programDetails?._url; else noThumbnail">
            <img [src]="programDetails?._url" width="100%" height="100%" class="upload-img">
        </div>

        <!-- Fallback message -->
        <ng-template #noThumbnail>
            <div class="thumbnail-error">
                No program thumbnail found...!
            </div>
        </ng-template>

    </div>

    <div [hidden]="selectedType !== 'custom'" class="">
        <div class="form-group">
            <label class="input-label" for="thumbnail">
                Thumbnail
            </label>
            <div class="file-upload">

                <!-- Upload Button -->
                <label class="upload-btn d-flex align-items-center gap-2" for="thumbnail">

                    <input id="thumbnail" type="file" hidden accept=".jpg,.jpeg,.png"
                        (change)="onThumbnailChange($event)" />

                    <img src="/program/upload-icon.svg" alt="">

                    <p class="m-0">Upload Image</p>
                </label>

                <!-- File Info -->
                <div class="upload-content" *ngIf="thumbnailFile">
                    <span class="file-name px-2">
                        {{ thumbnailFile?.name }}
                    </span>

                    <div class="division"></div>
                </div>
            </div>

            <!-- Image Preview -->
            <div *ngIf="thumbnailPreview" class="mt-3">

                <img [src]="thumbnailPreview" alt="Thumbnail Preview" class="upload-img" width="100%" />

            </div>

        </div>
    </div>

</div>


<!-- step 5 -->
<div>

    <div class="custom-line-sub mt-2"></div>


    <app-step-badge [stepNumber]="5" title="Public App Content"></app-step-badge>

    <div class="form-row px-4">
        <div class="form-group">


            <div class="form-row">
                <label class="input-label">Subtitle *</label>

            </div>
            <textarea class="input-field textarea-field "
                placeholder="e.g. RJ Neena chats about the actor’s latest movie, career journey, and upcoming projects"
                [(ngModel)]="subtitle" (ngModelChange)="onSubtitleChange($event)" rows="2" name="subtitle"></textarea>
            <p class="helper-text ">Keep it short and engaging for listeners.</p>

        </div>

    </div>

</div>
