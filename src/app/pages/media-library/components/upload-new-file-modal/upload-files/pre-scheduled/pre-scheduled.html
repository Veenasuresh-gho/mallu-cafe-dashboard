<div class="form-row px-4">

    <app-form-select label="Program *" [options]="programList" optionLabel="DisplayText" optionValue="DataValue"
        [(model)]="selectedProgramId" (modelChange)="onProgramChange($event)">
    </app-form-select>
    <div class="error-text" *ngIf="errors.program">
        <img src="/program/warn.svg" class="small mb-1">
        {{ errors.program }}
    </div>
</div>

<div class="custom-line-sub" style="margin-top: 14px;"></div>

<app-step-badge [stepNumber]="3" title="Rename File"></app-step-badge>

<div class="form-row px-4 pt-3">
    <div class="form-group">
        <div class="input-prefix-wrapper">
            <span class="prefix">{{selectedProgramName}}//</span>
            <div class="editable-part" contenteditable="true" (input)="onTextChange($event)"
                [attr.data-placeholder]="'160326.' + fileType">
            </div>
        </div>
        <p class="helper-text">Use the broadcast date in DDMMYY format.</p>
    </div>
    <div class="error-text" *ngIf="errors.date">
        <img src="/program/warn.svg" class="small mb-1">
        {{ errors.date }}
    </div>
</div>
<div class="error-text" *ngIf="errors.type">
    <img src="/program/warn.svg " class="small mb-1"> {{ errors.type }}
</div>
<div class="custom-line-sub"></div>

<app-step-badge [stepNumber]="4" title="Thumbnail"></app-step-badge>

<div class="d-flex gap-3 px-3 my-2">
    <div class="radio-grp py-2 px-2">
        <div class="custom-radio" [class.selected]="selectedType === 'program'"
            (click)="onThumbnailTypeChange('program')">
            <div class="circle"></div>
            <span>Use Program Thumbnail</span>
        </div>


        <div class="custom-radio"
     [class.selected]="selectedType === 'custom'"
     (click)="onThumbnailTypeChange('custom')">

    <div class="circle"></div>
    <span>Upload Custom Thumbnail</span>

</div>
    </div>
</div>
<div [hidden]="selectedType !== 'program'" class="mt-3 px-4">
    <div>
        <img [src]="programDetails?._url" width="100%" height="100%" ,class="upload-img">
    </div>
</div>

<div [hidden]="selectedType !== 'custom'" class="px-4">

    <div class="form-group">

        <label class="input-label" for="thumbnail">
            Custom Thumbnail
        </label>

        <div class="file-upload">

            <!-- Upload Button -->
            <label class="upload-btn d-flex gap-2">

                <input
                    id="thumbnail"
                    type="file"
                    hidden
                    accept=".jpg,.jpeg,.png"
                    (change)="onThumbnailChange($event)"
                />

                <img src="/program/upload-icon.svg" alt="">

                <p class="pt-3">
                    Upload Image
                </p>

            </label>

            <!-- File Name -->
            <span class="file-name px-2">
                {{ fileSelectedName || '- No file uploaded -' }}
            </span>

        </div>

        <p class="helper-text">
            JPG, JPEG, PNG formats. Required for podcast, featured videos, shorts.
        </p>

        <!-- IMAGE PREVIEW -->
        <div *ngIf="thumbnailPreview" class="upload-img mt-3">

            <img
                [src]="thumbnailPreview"
                alt="Thumbnail Preview"
                class="upload-img"
                width="100%" />

        </div>

    </div>

</div>
