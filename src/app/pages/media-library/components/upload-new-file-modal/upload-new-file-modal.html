<div class="dialog-box">
    <div class="d-flex justify-content-between align-items-center"
        style="padding-top: 24px; padding-left: 24px; padding-right: 24px;">
        <div>
            <p class="main-title">Upload Broadcast Media</p>
            <p class="main-subtitle">Upload audio or video content for your program and prepare it for publishing in the
                Mallu Cafe Radio App.</p>
        </div>
        <button class="close-btn btn-cancel" (click)="close()">
            <img src="/program/close-circle.svg" alt="">
        </button>
    </div>
    <div class="custom-line mt-2"></div>

    <mat-dialog-content class="dialog-content custom-select-panel">
        <app-step-badge [stepNumber]="1" title="Upload Media File"></app-step-badge>
        <div class="px-4">


            <app-upload-box [uploadText]="'Upload Broadcast Media File'"
                [subText]="'Drag & drop your file here, or click to browse'"
                [accept]="'audio/mp3,audio/mpeg,video/mp4,video/mpeg,.mp3,.mpeg,.mp4'"
                [sizeText]="'MP3, MPEG, MP4 • Max size: 1.5 GB'" (fileSelected)="onFileSelected($event)">
            </app-upload-box>
            <!-- uploaded file -->


        </div>
        <div class="px-3 mt-2">
            <div class="file-card d-flex gap-1 justify-content-between " *ngIf="fileName">
                <!-- Left: icon + name -->
                <div class="file-info d-flex ">
                    <!-- IMAGE -->
                    <img *ngIf="isImageType()" [src]="previewUrl" class="file-icon" />

                    <video *ngIf="isVideoType()" [src]="previewUrl" class="file-icon" muted></video>

                    <!-- FALLBACK -->
                    <img *ngIf="!isImageType() && !isVideoType()" src="/upload/file-default.svg" class="file-icon" />


                    <div class="d-flex file-details justify-content-between align-items-center w-100">

                        <div class="file-name text-truncate-custom">
                            {{ fileName }}
                            <img src="/upload/green-tick.svg" class="mb-1" alt="">
                        </div>

                        <div class="file-size px-2">
                            {{ fileSize }}
                        </div>

                    </div>
                </div>

                <div (click)="removeFile()" class="delete-btn">
                    <img src="/upload/trash-gray.svg" alt="">
                </div>
            </div>
        </div>
        <p class="d-flex gap-1 pt-2 pb-3 helper-text px-4 ">
            <span class="material-symbols-outlined helper-text-icon">
                warning
            </span>
            <span class="">Supported formats: MP3, WAV, MP4
            </span>
        </p>
        <div class="error-text px-4" *ngIf="errors.file">
            <img src="/program/warn.svg" class="small mb-1">
            {{ errors.file }}
        </div>
        <div class="custom-line-sub"></div>
        <app-step-badge [stepNumber]="2" title="Program Information" class=""></app-step-badge>


        <div class="form-row px-4">
            <app-form-select label="Category *" [options]="mediaTypeOptions" optionLabel="DisplyText"
                optionValue="DataValue" [(model)]="selectedMediaType" [disabled]="isPrefilledMode"
                (modelChange)="onMediaTypeChange($event)">
            </app-form-select>

        </div>
        <div [ngSwitch]="selectedMediaType">

            <div *ngSwitchCase="'1'" [class.disabled-section]="!selectedMediaType">
                <app-pre-scheduled
    [programList]="programList"
    [fileType]="extension"
    [prefillData]="originalPrefillData"
    [prefillDate]="selectedBroadcastDate"
    [readOnly]="isPrefilledProgram"
    (programSelected)="onProgramSelected($event)">
</app-pre-scheduled>
            </div>

            <div *ngSwitchCase="'2'">
                <app-podcast-file [programList]="programList" [fileType]="extension" [prefillData]="selectedProgramData"
                    [prefillDate]="selectedBroadcastDate" [readOnly]="isPrefilledProgram"
                    (programSelected)="onProgramSelected($event)">
                </app-podcast-file>
            </div>

            <app-video-file *ngSwitchCase="'3'" [fileName]="fileName" [fileType]="extension"
                (programSelected)="onProgramSelected($event)">
            </app-video-file>

            <app-shorts *ngSwitchCase="'4'" [fileName]="fileName" [fileType]="extension"
                (programSelected)="onProgramSelected($event)">
            </app-shorts>

            <div *ngSwitchDefault>
                <div class="disabled-section">
                    <app-pre-scheduled [programList]="programList" [fileType]="extension"
                        [prefillData]="selectedProgramData" [prefillDate]="selectedBroadcastDate"
                        (programSelected)="onProgramSelected($event)">
                    </app-pre-scheduled>
                </div>
            </div>

        </div>
        <hr>
        <div class=" footer">
            <div class="dialog-actions d-flex justify-content-end my-4 mx-3 gap-2">

                <div class="d-flex gap-2">

                    <button class="close-btn btn-cancel d-flex mx-3" (click)="close()">
                        <img src="/program/close-circle.svg" width="16px" alt="">
                        <p>Cancel</p>
                    </button>

                    <app-primary-button (clicked)="uploadFile()" [loading]="loading" [label]="'Upload File'"
                        iconSrc="/upload/tick-circle.svg">
                    </app-primary-button>
                </div>
            </div>
        </div>
    </mat-dialog-content>
</div>
