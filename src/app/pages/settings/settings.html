<div class="p-4 privacy-policy">
  <div class="d-flex align-items-center justify-content-between">
    <div>
      <h1 class="heading">PRIVACY POLICY</h1>
      <p>We value your privacy. This Privacy Policy explains how we handle your information when you use our radio app.</p>
    </div>
    <div>
      <app-primary-button class="btn-auto" [label]="'Update Privacy Policy'" iconSrc="/dash/logout.png"
        (click)="openUpdatePolicy()">
      </app-primary-button>
    </div>
  </div>

  <div class="policy-content" [innerHTML]="policyContent"></div>
</div>
