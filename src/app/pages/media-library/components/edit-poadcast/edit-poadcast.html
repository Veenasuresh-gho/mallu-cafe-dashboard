<div class="dialog-box">

    <div class="d-flex justify-content-between mb-1" style="padding-top: 24px;padding-left: 24px;padding-right: 24px;">

        <div>

            <p class="main-title">
                Edit podcast category
            </p>

            <p class="main-subtitle">
                Update your podcast category details.
            </p>

        </div>

        <button class="close-btn btn-cancel" (click)="close()">

            <img src="/program/close-circle.svg" alt="">

        </button>

    </div>

    <hr />

    <div class="dialog-content">

        <div style="gap: 6px;">

            <div class="form-row px-4">

                <app-form-input label="Podcast Category Name *" placeholder="e.g. Music, Sports, Movies"
                    name="categoryName" [(model)]="categoryName">
                </app-form-input>

                <p class="helper-text">
                    Update category name here.
                </p>

            </div>

            <div class="form-group px-4">

                <label class="input-label">
                    Category Icon
                </label>

                <!-- EXISTING IMAGE -->
                <div
    *ngIf="imageUrl && imageUrl.trim() !== ''; else uploadBlock"
    class="existing-file-container"
>

    <div class="file-input-wrapper">

        <input
            type="text"
            class="file-name-input"
            [value]="fileName"
            readonly
        >

        <button
            type="button"
            class="delete-btn"
            (click)="deleteCategoryIcon(fid)"
        >

            <img
                src="/program/trash.svg"
                alt="Delete"
            >

        </button>

    </div>

    <p class="helper-text pt-2">
        Existing category image uploaded
    </p>

</div>

<!-- FILE UPLOAD -->
<ng-template #uploadBlock>

    <app-file-upload
        label="Upload Image"
        accept="image/*"
        (fileSelected)="onFileSelected($event)">
    </app-file-upload>

    <p class="helper-text">
        JPG, JPEG, PNG formats.
    </p>

</ng-template>

            </div>

            <div class="dialog-actions d-flex justify-content-between my-4 mx-3 gap-2">

                <app-cancel-button class="pt-2" (click)="close()">
                </app-cancel-button>

                <app-primary-button (clicked)="updateCategory()" [loading]="loading" [label]="'Update Category'"
                    iconSrc="/upload/add-square.svg">
                </app-primary-button>

            </div>

        </div>

    </div>
